name: BlackEdge Deploy Staging
on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: 'Type DEPLOY-STAGING to allow a deploy to the isolated staging Worker'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: blackedge-staging-deploy
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: ${{ inputs.confirm_staging_only == 'DEPLOY-STAGING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: blackedge-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure deploy credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Install Wrangler and verify staging configuration
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));const s=JSON.parse(fs.readFileSync('wrangler.staging.jsonc','utf8'));if(p.name==='counter-beta-staging'||s.name!=='counter-beta-staging'||p.name===s.name)process.exit(1);console.log('staging Worker name verified:',s.name)"
          npx wrangler deploy --config wrangler.staging.jsonc --dry-run
      - name: Deploy only to staging
        run: npx wrangler deploy --config wrangler.staging.jsonc
      - name: Verify staging health and two client room
        run: |
          set -euo pipefail
          BASE=https://counter-beta-staging.tmbstartkleen.workers.dev
          curl -fLsS --retry 5 --retry-delay 3 --max-time 30 "$BASE/api/health" -o health.json
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('health.json','utf8'));if(d.ok!==true)process.exit(1)"
          node scripts/staging-smoke.mjs "$BASE"
      - name: Record staging evidence
        if: always()
        run: |
          echo "Staging-only deployment run; not a public beta approval." >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate main commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual device tests M01-M13 are still required." >> "$GITHUB_STEP_SUMMARY"
