name: Deploy BlackEdge Beta (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blackedge-beta-deploy
  cancel-in-progress: false
jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    environment: blackedge-beta
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Release verification
        run: npm run check
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Deploy isolated beta Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: publish
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --name blackedge-counter-beta 2>&1 | tee /tmp/blackedge-deploy.log
          BETA_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\\.workers\\.dev' /tmp/blackedge-deploy.log | tail -n 1 || true)"
          if [ -z "$BETA_URL" ]; then
            echo "::error::No workers.dev URL detected. Check that the Cloudflare workers.dev subdomain is enabled."
            exit 1
          fi
          echo "beta_url=$BETA_URL" >> "$GITHUB_OUTPUT"
      - name: Verify deployed beta health
        env:
          BETA_URL: ${{ steps.publish.outputs.beta_url }}
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 "$BETA_URL/api/health" | tee /tmp/blackedge-health.json
          node -e "const d=require('/tmp/blackedge-health.json');if(d.ok!==true)process.exit(1)"
          echo "BlackEdge beta: $BETA_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Health check: passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment follow-up
        run: echo "Perform multiplayer, mobile and tutorial browser testing before beta approval."
