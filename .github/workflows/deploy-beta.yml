name: Deploy BlackEdge Beta (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blackedge-beta-deploy
  cancel-in-progress: false
jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    environment: blackedge-beta
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Release verification
        run: npm run check
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Deploy isolated beta Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name blackedge-counter-beta
      - name: Deployment follow-up
        run: echo "Check the deployed workers.dev URL reported in the Wrangler step, then validate /api/health and multiplayer WebSocket rooms."
