name: BlackEdge Release Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: |
          node --check src/worker.js
          node --check src/blackjack-rules.js
          node --check v13-academy.js
          node --check v14-practice-room.js
          node --check v25-guided.js
          node --check v26-progress.js
      - name: Run blackjack and multiplayer regression tests
        run: node --test --test-reporter=tap tests/*.test.js
      - name: Report verification environment
        if: always()
        run: |
          echo "Commit: $GITHUB_SHA"
          node --version
