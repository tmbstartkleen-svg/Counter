name: BlackEdge Release Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: |
          node --check src/worker.js
          node --check src/blackjack-rules.js
          node --check v13-academy.js
          node --check v14-practice-room.js
          node --check v25-guided.js
          node --check v26-progress.js
          node --check v29-speed-academy.js
          node --check public/v29-speed-academy.js
          node --check v30-shoe-academy.js
          node --check public/v30-shoe-academy.js
          node --check v31-adaptive-coach.js
          node --check public/v31-adaptive-coach.js
          node --check v32-academy-layout.js
          node --check public/v32-academy-layout.js
          node --check v33-live-table.js
          node --check public/v33-live-table.js
          node --check v33-live-table.css
      - name: Run blackjack and multiplayer regression tests
        run: |
          mkdir -p test-results
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.js 2>&1 | tee test-results/blackedge-tests.tap
      - name: Validate Cloudflare Worker bundle without deploying
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/blackedge-build
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackedge-release-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Report verification environment
        if: always()
        run: |
          echo "Commit: $GITHUB_SHA"
          node --version
