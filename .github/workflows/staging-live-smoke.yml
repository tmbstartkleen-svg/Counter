name: BlackEdge Staging Live Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm separate staging deployment is reachable
        run: |
          set -euo pipefail
          STAGING="https://counter-beta-staging.tmbstartkleen.workers.dev"
          STATUS=$(curl -sS -L --max-time 15 -o staging-health.json -w '%{http_code}' "$STAGING/api/health")
          test "$STATUS" = "200" || { echo "Staging health returned HTTP $STATUS; deploy staging first."; exit 1; }
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('staging-health.json','utf8')); if(d.ok!==true)process.exit(1);"
      - name: Verify two real WebSocket connections on staging
        run: node scripts/staging-smoke.mjs https://counter-beta-staging.tmbstartkleen.workers.dev
      - name: Record limitation
        if: always()
        run: |
          echo "This run checks a deployed staging endpoint only. It does not deploy, use production or certify two physical devices." >> "$GITHUB_STEP_SUMMARY"
