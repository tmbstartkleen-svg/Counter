name: BlackEdge Browser Visual Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-table:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check local production assets with desktop and mobile Chromium
        run: |
          python3 -m http.server 8789 --bind 127.0.0.1 --directory public >/tmp/blackedge-http.log 2>&1 &
          for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:8789/online.html -o /dev/null; then break; fi; sleep 1; done
          node scripts/browser-table-smoke.mjs
      - name: Verify two real browsers play and settle a live multiplayer round
        timeout-minutes: 4
        run: node scripts/two-browser-live.mjs
      - name: Verify live active-hand disconnection and seat recovery
        timeout-minutes: 4
        run: node scripts/active-hand-disconnect.mjs
      - name: Verify live surrender decision and half-stake payout
        timeout-minutes: 4
        run: node scripts/live-surrender-browser.mjs
      - name: Verify live insurance wager and payout
        timeout-minutes: 4
        run: node scripts/live-insurance-browser.mjs
      - name: Verify live split-hand actions and independent settlements
        timeout-minutes: 4
        run: node scripts/live-split-browser.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackedge-responsive-browser-screenshots
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 14
