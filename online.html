<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlackEdge Elite · Online Rooms V18</title><style>body{font-family:system-ui;background:#06170f;color:#f4eee0;margin:0;padding:24px}main{max-width:900px;margin:auto}h1{color:#edc47c}.panel{background:#103421;padding:22px;border:1px solid #53744d;border-radius:16px;margin:16px 0}button,input{background:#215037;color:white;border:1px solid #79967a;padding:12px;border-radius:8px;font:inherit;margin:5px}button:disabled{opacity:.4}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{display:inline-grid;place-items:center;background:#fff9ee;color:#193420;border-radius:6px;width:38px;height:55px;margin:3px;font-weight:900}.info{color:#c5ddc9}#err{color:#ffc08a}a{color:#eec97d}</style><main><h1>BlackEdge Elite · Online Practice V18</h1><p>Private room by shared code · Virtual chips only · Educational prototype</p><div class="panel"><label>Room code <input id="room" maxlength="40" placeholder="example: table-2026"></label><label>Display name <input id="name" maxlength="24" placeholder="Player"></label><button id="join">Join room</button><button id="copy">Copy invite link</button><p id="status" class="info">Disconnected</p><p id="err" role="alert"></p></div><div class="panel"><h2>Dealer <span id="dealerScore"></span></h2><div id="dealer"></div><h2>Players</h2><div id="players" class="players"></div><p id="meta" class="info"></p><button id="deal" disabled>Host: deal round</button><button id="hit" disabled>Hit</button><button id="stand" disabled>Stand</button><button id="double" disabled>Double</button></div><p><a href="/">Return to casino academy</a></p></main><script>
const $=id=>document.getElementById(id);let socket=null,self=null,last=null;const safe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(c){return '<span class="card">'+(c.hidden?'🂠':safe(c.r)+safe(c.s))+'</span>'}
function score(a){if(a.some(x=>x.hidden))return '?';let v=0,ace=0;for(const c of a){if(c.r==='A'){v+=11;ace++}else v+=['J','Q','K','10'].includes(c.r)?10:Number(c.r)}while(v>21&&ace){v-=10;ace--}return v}
const msg=(type,extra={})=>{if(socket?.readyState===1)socket.send(JSON.stringify({type,...extra}))};
function render(s){last=s;$('dealer').innerHTML=s.dealer.map(card).join('');$('dealerScore').textContent=score(s.dealer);$('players').innerHTML=s.players.map(p=>'<div class="panel"><strong>'+safe(p.name)+(p.id===s.turnId?' · YOUR TURN':'')+'</strong><div>'+p.cards.map(card).join('')+'</div><p class="info">Total: '+score(p.cards)+' · '+safe(p.status)+'</p><p>Credits: '+p.bank+' · Wager: '+p.wager+'</p></div>').join('');$('meta').textContent=s.message+' · Round '+s.round+' · Cards remaining '+s.shoeRemaining+' · Running count '+s.visibleRunningCount;$('deal').disabled=s.playerId!==s.hostId||s.phase==='turn';const active=s.phase==='turn'&&s.turnId===s.playerId;for(const id of ['hit','stand','double'])$(id).disabled=!active;const me=s.players.find(p=>p.id===s.playerId);$('double').disabled=!active||!me||me.cards.length!==2||me.bank<me.wager}
$('join').onclick=()=>{const room=$('room').value.trim(),name=$('name').value.trim();if(!/^[a-zA-Z0-9_-]{4,40}$/.test(room)){$('err').textContent='Room code must use 4–40 letters, numbers, hyphens or underscores.';return}if(socket)socket.close();$('err').textContent='';const protocol=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(protocol+'//'+location.host+'/api/rooms/'+encodeURIComponent(room)+'/ws');socket.onopen=()=>{$('status').textContent='Connected to '+room;const token=sessionStorage.getItem('blackedge-seat-'+room);msg(token?'resume':'join',token?{token}:{});history.replaceState({},'', '?room='+encodeURIComponent(room))};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='welcome'){self=m.playerId;sessionStorage.setItem('blackedge-seat-'+$('room').value.trim(),m.token);if(!m.reconnected)msg('name',{name:$('name').value.trim()||'Guest'});}else if(m.type==='state')render(m);else if(m.type==='error'){$('err').textContent=m.message;if(/token invalid|expired/i.test(m.message))sessionStorage.removeItem('blackedge-seat-'+$('room').value.trim())}};socket.onclose=()=>{$('status').textContent='Disconnected';for(const id of ['hit','stand','double','deal'])$(id).disabled=true};socket.onerror=()=>{$('err').textContent='Could not reach online-room server. Deploy the Cloudflare Worker first.'}};
$('copy').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('room',$('room').value);try{await navigator.clipboard.writeText(u.toString());$('status').textContent='Invite link copied'}catch{$('status').textContent=u.toString()}};for(const id of ['deal','hit','stand','double'])$(id).onclick=()=>msg(id==='deal'?'start':id);
const code=new URLSearchParams(location.search).get('room');if(code)$('room').value=code;
</script></html>
